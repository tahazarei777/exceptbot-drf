[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exceptbot-drf"
version = "1.0.12"
description = "Exception Logger with AI Suggestions for Django REST Framework"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
    { name = "Brian Risk", email = "geneffects@gmail.com" },
    { name = "Taha Zarei", email = "momad6955@gmail.com" },
]
keywords = ["django", "drf", "exception", "logger", "ai", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Django>=3.2",
    "djangorestframework>=3.12",
    "openai>=1.3.7",
]

[project.urls]
Homepage = "https://exceptbot.com"
Repository = "https://github.com//exceptbot-drf"
"Bug Tracker" = "https://github.com/yourusername/exceptbot-drf/issues"

[tool.setuptools.packages.find]
include = ["exceptbot*"]

[tool.setuptools.package-data]
exceptbot = [
    "migrations/*.py",
    "templates/**/*",
    "static/**/*",
]