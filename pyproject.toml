[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exceptbot-drf"
version = "1.0.0"
description = "Exception Logger with AI Suggestions for Django REST Framework"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
    { name = "Taha Zarei", email = "tahazarei777@gmail.com" },
]
maintainers = [
    { name = "Taha Zarei", email = "tahazarei777@gmail.com" },
]
keywords = [
    "django",
    "django-rest-framework",
    "drf",
    "exception",
    "logger",
    "error-tracking",
    "middleware",
    "openai",
    "chatgpt",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
]
dependencies = [
    "Django>=3.2",
    "djangorestframework>=3.12",
    "openai>=1.3.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "pytest>=7.0.0",
    "pytest-django>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/tahazarei777/exceptbot-drf"
Repository = "https://github.com/tahazarei777/exceptbot-drf.git"
"Bug Tracker" = "https://github.com/tahazarei777/exceptbot-drf/issues"
Changelog = "https://github.com/tahazarei777/exceptbot-drf/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["exceptbot*"]
exclude = ["tests*", "test_project*"]

[tool.setuptools.package-data]
exceptbot = [
    "migrations/*.py",
    "py.typed",
]